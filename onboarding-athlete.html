<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Únete a tu Equipo · Ravix</title>
    <meta name="description" content="Ingresa tu código de equipo para acceder al portal del atleta de Ravix.">
    <link rel="icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #080808;
            --surface:  #111111;
            --border:   rgba(255,255,255,0.08);
            --text:     #F5F5F5;
            --muted:    #6b7280;
            --accent:   #00F0FF;
            --accent2:  #BFFF00;
            --error:    #ff4d4d;
            --success:  #10b981;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        /* Glowing orb */
        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,240,255,0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 48px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #000;
            letter-spacing: -1px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text);
        }

        .logo-text span {
            color: var(--accent);
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        }

        .card-eyebrow {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Form */
        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--muted);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: #0e0e0e;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 24px;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,240,255,0.1);
        }

        .form-input::placeholder {
            color: #333;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled {
            background: #1f2937;
            color: var(--muted);
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Feedback */
        .feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .feedback.error {
            display: flex;
            background: rgba(255,77,77,0.1);
            border: 1px solid rgba(255,77,77,0.3);
            color: var(--error);
        }

        .feedback.success {
            display: flex;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            color: var(--success);
        }

        /* Loading screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,240,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Loading Screen while we check auth -->
<div id="loading-screen">
    <div class="loading-spinner"></div>
    <p class="loading-text">VERIFICANDO SESIÓN...</p>
</div>

<!-- Main page (hidden until auth check completes) -->
<div class="page" id="main-page" style="display:none;">
    <div class="logo">
        <div class="logo-icon">R</div>
        <div class="logo-text">RAVI<span>X</span></div>
    </div>

    <div class="card">
        <p class="card-eyebrow">Portal del Atleta</p>
        <h1 class="card-title">Únete a tu Equipo</h1>
        <p class="card-subtitle">Ingresa el código de 6 caracteres que te entregó tu entrenador para vincular tu perfil al equipo.</p>

        <label for="team-code-input" class="form-label">Código de Equipo</label>
        <input
            id="team-code-input"
            type="text"
            class="form-input"
            placeholder="ABC123"
            maxlength="6"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
        >

        <button id="join-btn" class="btn-primary" onclick="joinTeam()">
            <span id="btn-label">UNIRME AL EQUIPO</span>
            <div id="btn-spinner" class="btn-spinner"></div>
        </button>

        <div id="feedback" class="feedback"></div>

        <div class="divider"></div>

        <p class="footer-text">
            ¿No eres atleta? <a href="index.html">Acceder como entrenador</a>
        </p>
    </div>
</div>

<script>
    // ── Supabase setup ──────────────────────────────────────────
    window.SUPA_URL = 'https://rscdpwarzltozigfbmev.supabase.co';
    window.SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzY2Rwd2Fyemx0b3ppZ2ZibWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjYyNjUsImV4cCI6MjA5MTg0MjI2NX0.WaKWoCxbaQ3VVDXLtfBvNyB9zywxZRHCwjzT-5gS-b0';
    const db = supabase.createClient(window.SUPA_URL, window.SUPA_KEY);

    // ── Auth gate ───────────────────────────────────────────────
    async function checkAuth() {
        try {
            const { data: { session } } = await db.auth.getSession();

            if (!session) {
                // No authenticated user — redirect to login
                window.location.replace('index.html');
                return;
            }

            const uid = session.user.id;

            // Fetch the athlete's profile — solo columnas que existen en la tabla
            const { data: profile, error } = await db
                .from('profiles_athlete')
                .select('id, full_name, sport, position')
                .eq('id', uid)
                .maybeSingle();

            // Si el perfil no existe aún, creamos uno mínimo para no romper el flujo
            if (!profile && !error) {
                await db.from('profiles_athlete').upsert({ id: uid }, { onConflict: 'id' });
            }

            // Si hubo error de DB (ej. columna inválida), igual mostramos el form
            // para no entrar en loop infinito con index.html
            if (error) {
                console.warn('[ONBOARDING] Error al leer perfil (no es fatal):', error.message);
                // Mostrar el formulario de todas formas
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-page').style.display = 'flex';
                return;
            }

            // Perfil completo (sport + position) → ir al dashboard directamente
            if (profile && profile.full_name && profile.sport && profile.position) {
                window.location.replace('dashboard-athlete.html');
                return;
            }

            // Perfil incompleto o sin equipo → mostrar formulario de onboarding
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';

        } catch (err) {
            console.error('[ONBOARDING] Auth check failed:', err);
            // NO redirigir a index.html para evitar el loop infinito.
            // Mostrar el formulario y dejar que el usuario actúe.
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';
        }
    }

    // ── Input auto-uppercase ────────────────────────────────────
    document.getElementById('team-code-input').addEventListener('input', function () {
        this.value = this.value.toUpperCase();
    });

    // Submit on Enter
    document.getElementById('team-code-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') joinTeam();
    });

    // ── Join team logic ─────────────────────────────────────────
    async function joinTeam() {
        const code = document.getElementById('team-code-input').value.trim().toUpperCase();
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('join-btn');
        const label = document.getElementById('btn-label');
        const spinner = document.getElementById('btn-spinner');

        // Reset feedback
        feedback.className = 'feedback';
        feedback.style.display = 'none';

        if (!code || code.length < 4) {
            showFeedback('error', '⚠️ Ingresa un código válido de al menos 4 caracteres.');
            return;
        }

        // Loading state
        btn.disabled = true;
        label.style.display = 'none';
        spinner.style.display = 'block';

        try {
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                window.location.replace('index.html');
                return;
            }
            const uid = session.user.id;

            // 1. Look up the team by code
            const { data: team, error: teamErr } = await db
                .from('teams')
                .select('id, name')
                .eq('code', code)
                .single();

            if (teamErr || !team) {
                showFeedback('error', '❌ Código incorrecto. Verifica con tu entrenador e intenta de nuevo.');
                resetBtn();
                return;
            }

            // 2. Assign team_id to this athlete's profile
            const { error: updateErr } = await db
                .from('profiles_athlete')
                .update({ team_id: team.id })
                .eq('id', uid);

            if (updateErr) {
                showFeedback('error', '🔴 Error al vincular el equipo. Intenta de nuevo.');
                resetBtn();
                return;
            }

            // 3. Success → redirect
            showFeedback('success', `✅ ¡Te uniste a ${team.name}! Redirigiendo...`);
            setTimeout(() => {
                window.location.replace('dashboard-athlete.html');
            }, 1200);

        } catch (err) {
            console.error('[ONBOARDING] joinTeam error:', err);
            showFeedback('error', '🔴 Error inesperado. Recarga la página e intenta de nuevo.');
            resetBtn();
        }
    }

    function showFeedback(type, msg) {
        const el = document.getElementById('feedback');
        el.className = `feedback ${type}`;
        el.innerHTML = msg;
    }

    function resetBtn() {
        const btn = document.getElementById('join-btn');
        const label = document.getElementById('btn-label');
        const spinner = document.getElementById('btn-spinner');
        btn.disabled = false;
        label.style.display = 'block';
        spinner.style.display = 'none';
    }

    // ── Boot ────────────────────────────────────────────────────
    checkAuth();
</script>

</body>
</html>
